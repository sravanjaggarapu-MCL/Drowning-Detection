<!--
============================================================
index.html
============================================================

DESCRIPTION:
This is the main HTML file used by Vite.
React will load the complete PoolGuard application
inside the element with id="root".
============================================================
-->

<!-- Define the HTML document type. -->
<!doctype html>

<!-- Start the HTML document. -->
<html lang="en">

<!-- Start the head section. -->
<head>

  <!-- Set character encoding. -->
  <meta charset="UTF-8" />

  <!-- Make the website responsive on mobile devices. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Set the browser tab title. -->
  <title>PoolGuard - Pool Safety Dashboard</title>

</head>

<!-- Start the body section. -->
<body>

  <!-- React will load the application inside this element. -->
  <div id="root"></div>

  <!-- Load the React application. -->
  <script type="module" src="/src/main.jsx"></script>

</body>

<!-- Close the HTML document. -->
</html>
